<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon-192-v4.png">
<link rel="icon" href="/icon-192-v4.png">
<title>Наше кіно</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  video { position: fixed; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  video.fit { object-fit: fill; }  /* geometry set by layoutVideo() */
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; background: rgba(0,0,0,.55); }
  #overlay.hidden { display: none; }
  #status { font-size: 18px; max-width: 520px; white-space: pre-line; }
  button { font: inherit; font-size: 20px; padding: 16px 30px; border-radius: 14px; border: 0; background: #4c8dff; color: #fff; cursor: pointer; }
  #bar { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; opacity: .85; transition: opacity .4s; }
  #bar.idle { opacity: 0; pointer-events: none; }
  #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: rgba(30,30,38,.88); font-size: 16px; white-space: nowrap; }
  button.sec { font-size: 16px; padding: 12px 22px; background: rgba(60,60,72,.9); }
  #bar button { font-size: 15px; padding: 10px 16px; background: rgba(40,40,48,.85); }
  .spin { width: 42px; height: 42px; border: 4px solid #555; border-top-color: #4c8dff; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<div id="overlay">
  <div class="spin" id="spin"></div>
  <div id="status">Підключення до трансляції…</div>
  <button id="go" hidden>▶ Дивитися зі звуком</button>
  <button id="install" class="sec" hidden>📲 Встановити як застосунок</button>
</div>
<div id="hint" hidden>🔇 Торкніться екрана, щоб увімкнути звук</div>
<div id="bar" hidden>
  <button id="pp" hidden>⏯ Пауза</button>
  <button id="fs">⛶ На весь екран</button>
</div>
<script>
"use strict";
const v = document.getElementById("v"), overlay = document.getElementById("overlay"), statusEl = document.getElementById("status"),
      go = document.getElementById("go"), spin = document.getElementById("spin"), bar = document.getElementById("bar"),
      fsBtn = document.getElementById("fs"), hint = document.getElementById("hint");
// Signaling endpoint: same origin by default (local test), or ?api=https://... (relay server)
const params = new URLSearchParams(location.search);
const api = (params.get("api") || "").replace(/\/$/, "");
const room = params.get("room") || (location.pathname.match(/\/r\/([a-z0-9]+)/) || [])[1] || "";
const ICE = [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }];

function show(text, spinning, button) {
  overlay.classList.remove("hidden"); statusEl.textContent = text;
  spin.hidden = !spinning; go.hidden = !button;
}
// Installable app (home-screen icon that opens straight into this room)
const installBtn = document.getElementById("install");
let installEvt = null;
if (room) {
  const link = document.createElement("link");
  link.rel = "manifest"; link.href = "/r/" + room + "/manifest.webmanifest";
  document.head.appendChild(link);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
window.addEventListener("appinstalled", () => { installBtn.hidden = true; installEvt = null; });
installBtn.onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; installBtn.hidden = true; };

// Sound on by default. The installed app may autoplay with sound; a plain browser tab may refuse it,
// then the picture starts muted and the first touch anywhere turns the sound on.
function playWithSound() {
  v.muted = false;
  v.play().then(() => { hint.hidden = true; }).catch(() => {
    v.muted = true; v.play().catch(() => {});
    hint.hidden = false;
  });
}
addEventListener("pointerdown", () => { if (v.muted && pc && pc.connectionState === "connected") { v.muted = false; v.play().catch(() => {}); hint.hidden = true; } }, true);

async function waitIce(pc) {
  if (pc.iceGatheringState === "complete") return;
  await new Promise(r => { const t = setTimeout(r, 3000);
    pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); r(); } }); });
}

let pc = null, retryTimer = null, stallTimer = null, offline = false;
async function connect() {
  clearTimeout(retryTimer); clearTimeout(stallTimer);
  if (pc) { try { pc.close(); } catch (e) {} }
  if (!offline) show("Підключення до трансляції…", true, false);  // no flicker while waiting for the stream to start
  try {
    const q = room ? "?room=" + encodeURIComponent(room) : "";
    // Through the relay server the media always goes via Cloudflare TURN on both sides: a direct path between
    // countries is often filtered and only costs time. Right after the player starts it may not have its TURN
    // credentials yet; its offer then has no relay candidate, so ask again shortly.
    const viaRelay = !!room && !params.has("direct");
    let r, id, sdp;
    for (let attempt = 0; ; attempt++) {
      r = await fetch(api + "/offer" + q, { method: "POST", cache: "no-store" });
      if (r.status === 404 || r.status === 410) { offline = true; show("Зараз трансляції немає.\nЩойно її запустять — підключиться само, нічого натискати не треба.", false, false); retryTimer = setTimeout(connect, 4000); return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (offline) { offline = false; show("Трансляція почалася, підключаюся…", true, false); }
      ({ id, sdp } = await r.json());
      if (!viaRelay || / typ relay/.test(sdp) || attempt >= 4) break;
      await new Promise(res => setTimeout(res, 1500));
    }
    // TURN relay credentials (for networks where a direct path is impossible); STUN-only fallback
    let ice = ICE;
    try {
      const ir = await fetch(api + "/ice" + q, { cache: "no-store" });
      if (ir.ok) { const j = await ir.json(); if (j.iceServers && j.iceServers.length) ice = j.iceServers; }
    } catch (e) {}
    const hasTurn = ice.some(s => [].concat(s.urls).some(u => u.startsWith("turn")));
    // ?direct=1 allows direct paths again (diagnostics)
    pc = new RTCPeerConnection({ iceServers: ice, iceTransportPolicy: (viaRelay && hasTurn) || params.has("relay") ? "relay" : "all" });
    const stream = new MediaStream();
    v.srcObject = stream;
    pc.ontrack = e => { stream.addTrack(e.track); };
    // Still not connected after 15 s: start over
    stallTimer = setTimeout(async () => {
      if (pc && pc.connectionState !== "connected") {
        show("Не вдається з'єднатися з трансляцією. Пробую ще раз…", true, false);
        connect();
      }
    }, 15000);
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") clearTimeout(stallTimer);
      if (s === "connected") { overlay.classList.add("hidden"); bar.hidden = false; playWithSound(); keepAwake(); }
      if (s === "failed" || s === "disconnected" || s === "closed") { bar.hidden = true; show("З'єднання втрачено. Повторне підключення…", true, false); retryTimer = setTimeout(connect, 2500); }
    };
    await pc.setRemoteDescription({ type: "offer", sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    const a = await fetch(api + "/answer?id=" + encodeURIComponent(id) + (room ? "&room=" + encodeURIComponent(room) : ""),
                          { method: "POST", cache: "no-store", headers: { "Content-Type": "application/sdp" }, body: pc.localDescription.sdp });
    if (!a.ok) throw new Error("HTTP " + a.status);
  } catch (e) {
    show("Не вдалося підключитися (" + e.message + "). Повтор через кілька секунд…", true, false);
    retryTimer = setTimeout(connect, 4000);
  }
}

// Keep the tablet screen on while watching (Android/Chrome, Safari 16.4+).
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && pc && pc.connectionState === "connected") keepAwake(); });
v.addEventListener("playing", keepAwake);

// Closing the page closes the connection right away (DTLS close), so the player's viewer count drops at once
// instead of after the ICE consent timeout.
window.addEventListener("pagehide", () => { clearTimeout(retryTimer); clearTimeout(stallTimer); if (pc) { pc.onconnectionstatechange = null; try { pc.close(); } catch (e) {} } });

// --- Picture fitting -------------------------------------------------------------------------------
// The stream is the player's whole video area, so letterbox bars are part of the picture. Find the
// non-black content box from time to time and scale that box (not the whole frame) to the screen.
// In fullscreen held landscape the picture covers the whole screen (edges cropped, no bars); held
// upright it is shown whole. The viewer turns the phone as she likes, nothing to switch.
let box = null, pendingBox = null, pendingCount = 0;
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const probe = document.createElement("canvas"), pctx = probe.getContext("2d", { willReadFrequently: true });
function detectBox() {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh || v.readyState < 2) return null;
  const W = 160, H = Math.max(1, Math.round(W * vh / vw));
  probe.width = W; probe.height = H;
  pctx.drawImage(v, 0, 0, W, H);
  const d = pctx.getImageData(0, 0, W, H).data;
  const bright = (x, y) => { const i = (y * W + x) * 4; return d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11 > 28; };
  const rowLit = y => { let n = 0; for (let x = 0; x < W; x++) if (bright(x, y)) n++; return n > W * 0.02; };
  const colLit = (x, y0, y1) => { let n = 0; for (let y = y0; y <= y1; y++) if (bright(x, y)) n++; return n > (y1 - y0 + 1) * 0.02; };
  let top = 0, bottom = H - 1, left = 0, right = W - 1;
  while (top < bottom && !rowLit(top)) top++;
  while (bottom > top && !rowLit(bottom)) bottom--;
  while (left < right && !colLit(left, top, bottom)) left++;
  while (right > left && !colLit(right, top, bottom)) right--;
  if ((right - left + 1) * (bottom - top + 1) < W * H * 0.3) return null;  // dark scene: keep the previous box
  const sx = vw / W, sy = vh / H, pad = 1;
  return { x: Math.max(0, (left + pad) * sx), y: Math.max(0, (top + pad) * sy),
           w: Math.min(vw, (right - left + 1 - 2 * pad) * sx), h: Math.min(vh, (bottom - top + 1 - 2 * pad) * sy) };
}
function sameBox(a, b) { return a && b && Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.w - b.w) + Math.abs(a.h - b.h) < (a.w + a.h) * 0.02; }
function layoutVideo() {
  const vw = v.videoWidth, vh = v.videoHeight, W = innerWidth, H = innerHeight;
  if (!vw || !vh) return;
  const b = box || { x: 0, y: 0, w: vw, h: vh };
  const cover = isFull() && W >= H;
  const k = cover ? Math.max(W / b.w, H / b.h) : Math.min(W / b.w, H / b.h);
  v.classList.add("fit");
  Object.assign(v.style, { width: vw * k + "px", height: vh * k + "px",
    left: (W - b.w * k) / 2 - b.x * k + "px", top: (H - b.h * k) / 2 - b.y * k + "px" });
  fsBtn.textContent = isFull() ? "✕ Звичайний режим" : "⛶ На весь екран";
}
setInterval(() => {
  if (!pc || pc.connectionState !== "connected") return;
  let nb = null;
  try { nb = detectBox(); } catch (e) { return; }
  if (!nb) return;
  // Change only after the same box is seen twice in a row (subtitles or a flash do not shake the picture)
  if (sameBox(nb, box)) { pendingCount = 0; return; }
  if (sameBox(nb, pendingBox)) pendingCount++; else { pendingBox = nb; pendingCount = 1; }
  if (pendingCount >= 2) { box = nb; pendingCount = 0; layoutVideo(); }
}, 1500);
v.addEventListener("resize", () => { box = null; layoutVideo(); });
v.addEventListener("loadedmetadata", layoutVideo);
addEventListener("resize", layoutVideo);
document.addEventListener("fullscreenchange", layoutVideo);
document.addEventListener("webkitfullscreenchange", layoutVideo);
if (screen.orientation) screen.orientation.addEventListener("change", () => setTimeout(layoutVideo, 150));
v.addEventListener("dblclick", () => fsBtn.onclick());
// Buttons fade out while watching; a tap brings them back
let idleTimer = null;
function wake() { bar.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => bar.classList.add("idle"), 4000); }
["pointerdown", "pointermove", "keydown"].forEach(e => addEventListener(e, wake, { passive: true }));
wake();

// Pause / resume the film for both (the player on the laptop is paused; works only through the relay)
const ppBtn = document.getElementById("pp");
if (room) ppBtn.hidden = false;
ppBtn.onclick = async () => {
  ppBtn.disabled = true;
  try { await fetch(api + "/control?room=" + encodeURIComponent(room) + "&action=playpause", { method: "POST", cache: "no-store" }); } catch (e) {}
  setTimeout(() => { ppBtn.disabled = false; }, 600);
};

go.onclick = () => { playWithSound(); overlay.classList.add("hidden"); keepAwake(); };
// One button: fullscreen. The phone may be turned either way; no orientation lock.
fsBtn.onclick = () => {
  const el = document.documentElement;
  if (isFull()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iPhone Safari
};
connect();
</script>
</body>
</html>
